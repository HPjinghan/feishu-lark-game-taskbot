<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>飞书任务机器人 · 本地模拟器</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { background: #fff; padding: 12px 20px; border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; margin: 0; color: #222; }
  header button { border: none; background: #eee; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  header button:hover { background: #ddd; }
  #hint { padding: 8px 20px; font-size: 12px; color: #888; background: #fff; border-bottom: 1px solid #eee; }
  #log { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.6; font-size: 14px; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #07c160; color: #fff; border-bottom-right-radius: 2px; }
  .msg.bot { align-self: flex-start; background: #fff; color: #222; border: 1px solid #e5e5e5; border-bottom-left-radius: 2px; }
  .msg.system { align-self: center; color: #999; font-size: 12px; background: none; max-width: 90%; text-align: center; }
  #inputBar { display: flex; padding: 12px 20px; background: #fff; border-top: 1px solid #e5e5e5; gap: 8px; }
  #inputBar input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  #inputBar button { padding: 10px 20px; border: none; background: #07c160; color: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #inputBar button:disabled { background: #aaa; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>🤖 飞书任务机器人 · 本地模拟器</h1>
    <button id="resetBtn">重置状态</button>
  </header>
  <div id="hint">输入 @名字（比如 @张三）会被模拟成真实的飞书 @ 提及；机器人会像在生产环境一样处理。多维表格和飞书 API 全部是内存模拟数据，重置按钮会清空重来。</div>
  <div id="log"></div>
  <div id="inputBar">
    <input id="input" type="text" placeholder="像在飞书里一样打字，比如：排期 在3.1-3.30前排期一个月卡功能" autofocus />
    <button id="sendBtn">发送</button>
  </div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const resetBtn = document.getElementById('resetBtn');

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  sendBtn.disabled = true;
  const pending = addMsg('（机器人处理中…）', 'system');

  try {
    const res = await fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    pending.remove();
    if (!data.messages || data.messages.length === 0) {
      addMsg('（机器人没有回复 —— 这句话可能没有匹配任何指令）', 'system');
    } else {
      for (const m of data.messages) addMsg(m.text, 'bot');
    }
  } catch (e) {
    pending.remove();
    addMsg('请求出错：' + e.message, 'system');
  }

  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

resetBtn.addEventListener('click', async () => {
  await fetch('/reset', { method: 'POST' });
  log.innerHTML = '';
  addMsg('已重置模拟状态（清空虚拟 KV 和虚拟表格数据，通讯录也会清空）。', 'system');
});

addMsg('模拟器已就绪。试试：排期 在3.1-3.30前排期一个月卡功能', 'system');
addMsg('或者先创建一个任务：创建任务 上传头像 客户端 v1.2 ddl 6/20 @张三', 'system');
</script>
</body>
</html>
